; Firmware TP Final IoT — Grupo 1 (variante power-saving)
;
; Entornos:
;   collar_sim / unit_sim               -> Wokwi (RadioSim por serie, GPS simulado, BLE por consola)
;   collar_sim_interop / unit_sim_interop -> igual pero SIN logs en el puerto (pruebas cruzadas)
;   collar_lora / unit_lora             -> placas reales (SX1278 Ra-01, NEO-6M, BLE NimBLE)
;   native                              -> tests unitarios en la PC (pio test -e native)
;
; Identidad: DEV_ID = (grupo << 8) | collar. Cambiarlo acá, nunca en el código.

[platformio]
default_envs = collar_sim, unit_sim

[common]
build_flags =
  -D DEV_ID=0x0101
  -D PAIRED_DEV_ID=0x0101
  -D FW_MAJOR=1
  -D FW_MINOR=0
  -D FW_PATCH=0
  -D DEFAULT_INTERVAL_S=15

[collar_base]
platform = atmelavr@^5.0.0
board = nanoatmega328
framework = arduino
build_src_filter = +<collar/>
lib_deps =
  mikalhart/TinyGPSPlus@^1.1.0

[unit_base]
platform = espressif32@^6.9.0
board = wemos_d1_uno32
framework = arduino
build_src_filter = +<unit/>
monitor_speed = 115200

[env:collar_sim]
extends = collar_base
build_flags = ${common.build_flags} -D RADIO_LORA=0 -D GPS_SIM=1 -D LOG_ENABLED=1

[env:collar_sim_interop]
extends = collar_base
build_flags = ${common.build_flags} -D RADIO_LORA=0 -D GPS_SIM=1 -D LOG_ENABLED=0

[env:collar_lora]
extends = collar_base
build_flags = ${common.build_flags} -D RADIO_LORA=1 -D GPS_SIM=0 -D LOG_ENABLED=1
lib_deps =
  ${collar_base.lib_deps}
  sandeepmistry/LoRa@^0.8.0

[env:unit_sim]
extends = unit_base
build_flags = ${common.build_flags} -D RADIO_LORA=0 -D ENABLE_BLE=0 -D LOG_ENABLED=1

[env:unit_sim_interop]
extends = unit_base
build_flags = ${common.build_flags} -D RADIO_LORA=0 -D ENABLE_BLE=0 -D LOG_ENABLED=0

[env:unit_lora]
extends = unit_base
build_flags = ${common.build_flags} -D RADIO_LORA=1 -D ENABLE_BLE=1 -D LOG_ENABLED=1
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  h2zero/NimBLE-Arduino@~1.4.3

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra
lib_ignore = pet_radio
